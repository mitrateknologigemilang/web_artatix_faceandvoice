
server {
    listen 8080;
    server_name _;

    # Cloud Run terminates HTTPS at its trusted proxy/load balancer. Keep
    # Nginx-generated redirects relative so the internal listener port is
    # never exposed as part of a public URL.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # MIME type untuk JavaScript module
    location ~* \.mjs$ {
        default_type text/javascript;
        try_files $uri =404;
    }

    # MIME type untuk WebAssembly
    location ~* \.wasm$ {
        default_type application/wasm;
        try_files $uri =404;
    }

    # SPA fallback untuk Vue/React
    location / {
        # Next.js static export writes routes as .html files. Check these
        # before directories to avoid Nginx's automatic slash redirect.
        try_files $uri.html $uri/index.html $uri $uri/ /index.html;
    }
}
