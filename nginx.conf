
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # MIME type untuk JavaScript module
    location ~* \.mjs$ {
        default_type text/javascript;
        try_files $uri =404;
    }

    # MIME type untuk WebAssembly
    location ~* \.wasm$ {
        default_type application/wasm;
        try_files $uri =404;
    }

    # SPA fallback untuk Vue/React
    location / {
        try_files $uri $uri/ /index.html;
    }
}
