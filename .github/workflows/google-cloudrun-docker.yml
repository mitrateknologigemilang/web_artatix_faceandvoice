name: 'Build and Deploy to Cloud Run'

on:
  push:
    branches:
      - feat/belikarcis-prod

env:
  PROJECT_ID: 'beli-karcis'
  ARTIFACT_REGION: 'asia-southeast1'
  ARTIFACT_REPOSITORY: 'frontend-sistem-konser'
  CRUN_REGION: 'asia-southeast1'
  CRUN_SERVICE: 'face-regis-sistem-konser'
  SERVICE_ACCOUNT: 'github-actions-deployer@beli-karcis.iam.gserviceaccount.com'

jobs:
  deploy:
    runs-on: 'ubuntu-latest'

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v3'
        with:
          workload_identity_provider: '${{ vars.WORKLOAD_IDENTITY_PROVIDER }}'
          project_id: ${{ env.PROJECT_ID }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          token_format: access_token

      - name: 'Docker Auth'
        uses: 'docker/login-action@v3'
        with:
          username: 'oauth2accesstoken'
          password: '${{ steps.auth.outputs.access_token }}'
          registry: '${{ env.CRUN_REGION }}-docker.pkg.dev'

      - name: 'Build and Push Container'
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_X_API_KEY: ${{ vars.NEXT_PUBLIC_X_API_KEY }}
        run: |-
          docker build \
            --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
            --build-arg NEXT_PUBLIC_X_API_KEY="$NEXT_PUBLIC_X_API_KEY" \
            -t "${{ env.ARTIFACT_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.CRUN_SERVICE }}:${{ github.sha }}" ./
          docker push "${{ env.ARTIFACT_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.CRUN_SERVICE }}:${{ github.sha }}"

      - name: 'Deploy to Cloud Run'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: '${{ env.CRUN_SERVICE }}'
          region: '${{ env.CRUN_REGION }}'
          image: ${{ env.ARTIFACT_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.CRUN_SERVICE }}:${{ github.sha }}

      - name: 'Show output'
        run: echo ${{ steps.deploy.outputs.url }}